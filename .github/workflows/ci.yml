name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - name: ruff format --check (advisory until the api lane adopts it)
        run: ruff format --check .
        continue-on-error: true
      - run: pytest -q

  gates:
    name: gate replica
    runs-on: ubuntu-latest
    env:
      # Optional: with these secrets set, the replica exercises the real LLM path.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            eval/requirements.txt
      - run: pip install -r api/requirements.txt -r eval/requirements.txt
      - name: lint eval
        run: ruff check eval && ruff format --check eval
      - name: eval unit tests
        run: pytest eval/tests -q
      - name: start API (fresh process, empty SIIS cache)
        working-directory: api
        run: |
          nohup uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"; exit 1
      - name: gate replica (G2, G4, G5 enforced; the rest reported)
        run: python eval/gate_replica.py --api http://localhost:8000 --results results.jsonl --enforce G2,G4,G5
      - name: API log
        if: always()
        run: cat "$RUNNER_TEMP/api.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gates
          path: eval/results/gates.json
