services:
  api:
    build:
      context: .            # repo root: the image needs data/kit as well as api/
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      ONECLICK_DATA: /data      # data/kit is copied here; build scripts write /data/build
      ONECLICK_SQLITE: /data/cache.sqlite
    restart: unless-stopped     # ADR-007: the judging window must not find it stopped
